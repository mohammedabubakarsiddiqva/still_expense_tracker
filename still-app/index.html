all.forEach((m,i)=>{const x=36+i*40,fu=mi(m)>mi(cm),pv=paid(m),ev=est(m),lb=new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short',year:'2-digit'});

function pager(k,n,sz){const pg=Math.max(1,Math.ceil(n/sz));if(P[k]>=pg)P[k]=pg-1;if(P[k]<0)P[k]=0;return pg<2?'':'<div class="tools" style="justify-content:center;margin:12px 0 0"><button class="b s" '+(P[k]?'':'disabled')+' onclick="P.'+k+'--;R()">‹ Previous</button><span class="m">Page '+(P[k]+1)+' of '+pg+'</span><button class="b s" '+(P[k]<pg-1?'':'disabled')+' onclick="P.'+k+'++;R()">Next ›</button></div>'}
const got=t=>(t.rec?t.rec.got:[]).reduce((a,x)=>a+x.a,0);
const inM=m=>S.tx.filter(t=>mk(t.date)===m);
const lm=m=>S.loans.filter(l=>mk(l.date)===m),lent=m=>inM(m).filter(t=>t.rec&&t.rec.type==='loan').reduce((a,t)=>a+t.amount,0),lback=m=>lm(m).reduce((a,l)=>a+l.back.reduce((b,x)=>b+x.a,0),0),pT=m=>inM(m).reduce((a,t)=>a+t.amount,0),rT=m=>inM(m).reduce((a,t)=>a+got(t),0),paid=m=>pT(m),rcv=m=>rT(m),net=m=>paid(m)-rcv(m);

function capLimit(n,m){let c=+S.caps[n]||0;if(startPartial(m)&&S.capMode==='prorate'){const[y,mo,d]=S.start.split('-').map(Number),dim=new Date(y,mo,0).getDate();c=c*(dim-d+1)/dim}return c}
function capBars(m){return NEC.map(n=>{const sp=inM(m).filter(t=>t.nec===n&&!(t.rec&&t.rec.type==='loan')).reduce((a,t)=>a+t.amount-got(t),0),L=capLimit(n,m),p=L?sp/L:0,cl=p>=1?'x':p>=.85?'w':'';

const rw=t=>'<div class="row"><div><b>'+esc(t.desc)+'</b> <span class="tag">'+L[t.rec.type]+'</span><div class="m">'+(t.person?esc(t.person)+' · ':'')+t.date+' · paid '+fmt(t.amount)+(t.rec.type==='shared'?' · your share '+fmt(t.amount-t.rec.exp):'')+' · received '+fmt(got(t))+' of '+fmt(t.rec.exp)+'</div></div><div style="text-align:right"><b class="up">'+fmt(pend(t))+'</b><div><button class="b s" onclick="recv(\''+t.id+'\')">Received</button></div></div></div>';
return`<h2>Money to recover <span class="big up" style="font-size:22px">${fmt(openRec())}</span></h2><div class="m">Settled items leave this list automatically. Loans are never counted as expenses or income.</div>
<div class="c" style="margin-top:10px"><h3>Who owes you</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="chip" style="background:none;color:var(--ink);padding:3px 10px;cursor:pointer" data-p="${esc(k)}" onclick="rq=this.dataset.p;resetP();R()">${esc(k)} <b>${fmt(v)}</b></button>`).join('')||'<span class="m">Nobody owes you anything.</span>'}</div>
<div class="tools" style="margin-top:12px"><select onchange="rt=this.value;resetP();R()"><option value="">All types</option>${Object.entries(L).map(([k,v])=>`<option value="${k}" ${rt===k?'selected':''}>${v}</option>`).join('')}</select><input placeholder="Search person or item" value="${esc(rq)}" onchange="rq=this.value;resetP();R()" style="width:190px">${rq?'<button class="b s" onclick="rq=\'\';resetP();R()">Clear search</button>':''}</div>
<div class="c">${it.map(rw).join('')||'<div class="m">'+(open.length?'Nothing matches.':'All settled. To track money you lent, use + Add expense and choose “Money lent to a friend”.')+'</div>'}${pgr}</div>`},
Overview(){const m=cm,p=paid(m),r=rcv(m);return`<div class="tools" style="justify-content:space-between;margin:4px 0 12px"><h2 style="margin:0">${mlab(m)}${startPartial(m)?' <span class="tag w">partial month · tracking from '+sd()+'</span>':''}</h2><button class="b p" onclick="txForm()">+ Add expense</button></div>
<div class="g k"><div class="c hero"><div class="m">Paid this month</div><div class="big h">${fmt(p)}</div><div class="m">Actual money out${lent(m)?' · incl. '+fmt(lent(m))+' lent':''}</div></div>
<div class="c"><div class="m">Recovered so far</div><div class="big">${fmt(r)}</div><div class="m">Refunds, repayments, reimbursements</div></div>
<div class="c"><div class="m">Net expenses</div><div class="big">${fmt(p-r)}</div><div class="m">Paid minus recovered</div></div>
<div class="c"><div class="m">Monthly estimate</div><div class="big">${fmt(est(m))}</div><div class="m">Long-lasting buys spread across their months</div></div>
<div class="c"><div class="m">Still to recover</div><div class="big up">${fmt(openRec())}</div><div class="m">Shared bills, loans, refunds, reimbursements</div></div></div>
${fut().length?'<h2>Coming months (estimate)</h2><div class="c">'+fut().slice(0,6).map(x=>'<div class="row"><span>'+mlab(x)+'</span><b>'+fmt(est(x))+'</b></div>').join('')+'<div class="m" style="margin-top:6px">Your share of multi-month purchases still to come.</div></div>':''}<h2>Spending caps</h2><div class="g">${capBars(m)}</div><h2>This month by necessity</h2><div class="c">${brk(sums(m,t=>t.nec))}</div>`},
History(){const ms=months(),has=m=>inM(m).length>0||lm(m).length>0,dm=ms.filter(has),avg=dm.length?dm.reduce((a,m)=>a+paid(m),0)/dm.length:0;if(!ms.includes(sel))sel=cm;
return`<h2>Monthly history</h2>${chart()}<div class="c tbl" style="margin-top:12px"><table><tr><th>Month</th><th>Paid</th><th>Estimate</th><th>Recovered</th><th>Net</th></tr>${fut().reverse().map(m=>'<tr><td>'+mlab(m)+' <span class="tag">projected</span></td><td class="m">—</td><td>'+fmt(est(m))+'</td><td class="m">—</td><td class="m">—</td></tr>').join('')}${ms.slice().reverse().map(m=>has(m)?`<tr class="cl ${m===sel?'sel':''}" onclick="sel='${m}';R()"><td>${mlab(m)}${startPartial(m)?' <span class="tag w">partial · from '+sd()+'</span>':''}${dm.length>=3&&paid(m)>avg*1.5?' <span class="tag w">high</span>':''}</td><td>${fmt(paid(m))}</td><td>${fmt(est(m))}</td><td>${fmt(rcv(m))}</td><td><b>${fmt(net(m))}</b></td></tr>`:`<tr class="cl ${m===sel?'sel':''}" onclick="sel='${m}';R()"><td>${mlab(m)}</td>${est(m)>0?'<td class="m">—</td><td>'+fmt(est(m))+'</td><td class="m" colspan="2" style="text-align:left">No payments recorded</td>':'<td colspan="4" class="m" style="text-align:left">No data recorded</td>'}</tr>`).join('')}</table></div>
<h2>${mlab(sel)} breakdown</h2><div class="g"><div class="c"><h3>By category</h3>${brk(sums(sel,t=>catName(t.cat)))}</div><div class="c"><h3>By necessity</h3>${brk(sums(sel,t=>t.nec))}</div></div>`},
Caps(){return`<h2>Spending caps</h2><div class="c"><div class="f">${NEC.map(n=>`<label>${n} (monthly, ₹)<input type="number" value="${S.caps[n]||0}" onchange="S.caps['${n}']=+this.value;save();R()"></label>`).join('')}<label class="w">If tracking starts mid-month<select onchange="S.capMode=this.value;save();R()"><option value="prorate" ${S.capMode==='prorate'?'selected':''}>Prorated cap for the starting month</option><option value="full" ${S.capMode==='full'?'selected':''}>Full cap for the starting month</option></select></label></div><div class="m" style="margin-top:8px">Full caps apply automatically from the next month. Caps count spending after recoveries.</div></div><h2>${mlab(cm)} progress</h2><div class="g">${capBars(cm)}</div>`},
Settings(){return`<h2>Tracking</h2><div class="c"><label class="m">Tracking start date<br><input type="date" value="${S.start}" onchange="S.start=this.value||today();save();R()"></label></div>
<h2>Categories</h2><div class="c">${S.cats.map(c=>`<div class="row" style="align-items:flex-start"><div><b ${c.arch?'style="opacity:.5"':''}>${esc(c.name)}</b>${c.arch?' <span class="tag w">archived</span>':''}<div>${c.subs.map((s,i)=>`<span class="chip">${esc(s)}<button onclick="subEdit('${c.id}',${i},1)">✎</button><button onclick="subEdit('${c.id}',${i},0)">×</button></span>`).join('')}<button class="b s" onclick="subAdd('${c.id}')">+ subcategory</button></div></div><div style="white-space:nowrap"><button class="b s" onclick="catRen('${c.id}')">Rename</button> <button class="b s" onclick="catArch('${c.id}')">${c.arch?'Restore':'Remove'}</button></div></div>`).join('')}<div class="tools" style="margin:10px 0 0"><button class="b p" onclick="catAdd()">+ Add category</button></div></div>
<h2>Account</h2><div class="c"><div class="row" style="border:0"><div><b>${esc(user?user.email:'')}</b><div class="m" id="syncs">${sync}</div></div><button class="b" onclick="out()">Sign out</button></div></div>
<h2>Backup</h2><div class="c"><div class="m" style="margin-bottom:8px">Data lives only in this browser. Back up regularly, especially before switching devices.${mem?' <b class="up">Browser storage is unavailable here, so changes will not persist.</b>':''}</div><div class="tools"><button class="b" onclick="io('csv')">Export CSV</button><button class="b" onclick="io('json')">Backup JSON</button><button class="b" onclick="io('restore')">Restore backup</button><button class="b" onclick="eraseAll()">Erase all</button></div></div>`}};
function fx(){const v=f_r.value,l=v==='loan';f_x.parentNode.style.display=v&&!l?'':'none';f_xl.textContent=v==='shared'?'Your own share (₹)':'Amount expected back (₹)';document.querySelectorAll('.nl').forEach(e=>e.style.display=l?'none':'');f_ln.parentNode.style.display=l?'':'none'}
function mig(){if(S.loans&&S.loans.length){const oc=(S.cats.find(c=>c.name==='Other expenses')||S.cats[0]).id;S.loans.forEach(l=>S.tx.push({id:l.id,ts:+new Date(l.date)||0,desc:'Loan to '+l.person,amount:l.amount,date:l.date,cat:oc,nec:'Unclassified',person:l.person,rec:{type:'loan',exp:l.amount,got:l.back}}));S.loans=[];save()}}
function R(){mig();const t=[['Overview','Overview'],['Transactions','Transactions'],['Recover','Money to recover'],['History','Monthly history'],['Caps','Spending caps'],['Settings','Settings']];
nav.innerHTML='<b>Still</b>'+t.map(([k,l])=>`<button class="${k===view?'on':''}" onclick="view='${k}';R();scrollTo(0,0)"><i>${I[k]}</i><span class="l">${l}</span><span class="sh">${SH[k]}</span></button>`).join('');app.innerHTML=V[view]();document.body.className=view}
const subOpts=(cid,cur)=>{const c=S.cats.find(x=>x.id===cid);return'<option value="">—</option>'+(c?c.subs:[]).map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('')};
function txForm(id){const t=S.tx.find(x=>x.id===id)||{date:today(),nec:'Unclassified',cat:S.cats.find(c=>!c.arch).id},o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
dlg.innerHTML=`<h3>${id?'Edit':'Add'} expense</h3><div class="f"><label class="w">Description<input id="f_d" value="${esc(t.desc)}" autofocus></label><label>Amount paid (₹)<input id="f_a" type="number" value="${t.amount??''}"></label><label>Date<input id="f_t" type="date" value="${t.date}"></label>
<label class="nl">Category<select id="f_c" onchange="f_s.innerHTML=subOpts(this.value)">${S.cats.filter(c=>!c.arch||c.id===t.cat).map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="nl">Subcategory<select id="f_s">${subOpts(t.cat,t.sub)}</select></label>
<label class="nl">Necessity<select id="f_n">${o(NEC,t.nec)}</select></label><label class="nl">Frequency<select id="f_f"><option value="">—</option>${o(FREQ,t.freq)}</select></label>
<label class="w">Recovery<select id="f_r" onchange="fx()"><option value="">None</option><option value="shared" ${t.rec&&t.rec.type==='shared'?'selected':''}>Friends owe me a share</option><option value="refund" ${t.rec&&t.rec.type==='refund'?'selected':''}>Refund expected</option><option value="reimb" ${t.rec&&t.rec.type==='reimb'?'selected':''}>Reimbursement expected</option><option value="loan" ${t.rec&&t.rec.type==='loan'?'selected':''}>Money lent to a friend</option></select></label>
<label class="w" style="${t.rec?'':'display:none'}"><span id="f_xl">${t.rec&&t.rec.type==='shared'?'Your own share (₹)':'Amount expected back (₹)'}</span><input id="f_x" type="number" value="${t.rec?(t.rec.type==='shared'?t.amount-t.rec.exp:t.rec.exp):''}"></label>
<label class="w" style="${t.rec&&t.rec.type==='loan'?'':'display:none'}"><span>Lent to</span><input id="f_ln" value="${esc(t.person)}" placeholder="Friend’s name"></label>
<details class="w nl"><summary class="m">More details (optional)</summary><div class="f" style="margin-top:8px"><label>Payment method<select id="f_p"><option value="">—</option>${o(PAY,t.pay)}</select></label><label>Purpose tag<select id="f_u"><option value="">—</option>${o(PUR,t.purpose)}</select></label><label>Lasts (months)<input id="f_m" type="number" min="1" value="${t.dur||''}"></label><label>Person / shop<input id="f_e" value="${esc(t.person)}"></label><label class="w">Notes<textarea id="f_o" rows="2">${esc(t.notes)}</textarea></label></div></details></div>
<div class="tools" style="margin:14px 0 0;justify-content:flex-end"><button class="b" onclick="dlg.close()">Cancel</button><button class="b p" onclick="saveTx('${id||''}')">Save</button></div>`;dlg.showModal();fx()}
function saveTx(id){const a=+f_a.value;const LN=f_r.value==='loan';if(LN&&!f_ln.value.trim()){note('Add who you lent to.');return}if((!LN&&!f_d.value.trim())||!(a>0)||!f_t.value){note('Add a description, an amount above 0 and a date.');return}
const old=S.tx.find(x=>x.id===id),t={id:id||uid(),ts:old&&old.ts||Date.now(),desc:f_d.value.trim()||('Loan to '+f_ln.value.trim()),amount:a,date:f_t.value,cat:f_c.value,sub:f_s.value,nec:f_n.value,freq:f_f.value,pay:f_p.value,purpose:f_u.value,dur:+f_m.value||0,person:LN?f_ln.value.trim():f_e.value.trim(),notes:f_o.value.trim()};
if(f_r.value){const x=+f_x.value||0,ex=LN?a:f_r.value==='shared'?a-x:x;if(!(ex>0)||ex>a){note('The amount to recover must be above 0 and not more than the amount paid.');return}t.rec={type:f_r.value,exp:ex,got:old&&old.rec?old.rec.got:[]}}
if(old)Object.assign(old,t);else S.tx.push(t);if(filt!=='all'&&mk(t.date)!==filt)filt=mk(t.date);save();dlg.close();R()}
const gid=x=>document.getElementById(x);
function ask(o){return new Promise(res=>{md.innerHTML=`<h3 style="margin:0 0 6px;font-size:17px">${esc(o.title)}</h3>${o.msg?`<div class="m" style="margin-bottom:12px">${esc(o.msg)}</div>`:'<div style="height:6px"></div>'}${o.field?`<input id="md_i" type="${o.type||'text'}" ${o.type==='number'?'inputmode="decimal"':''} value="${esc(o.value??'')}" style="width:100%;margin-bottom:14px">`:''}<div class="tools" style="margin:0;justify-content:flex-end">${o.cancel===false?'':'<button class="b" id="md_c">Cancel</button>'}<button class="b p${o.danger?' dg':''}" id="md_o">${esc(o.ok||'OK')}</button></div>`;
const done=v=>{md.close();res(v)},i=gid('md_i'),c=gid('md_c');gid('md_o').onclick=()=>done(i?i.value:true);if(c)c.onclick=()=>done(null);md.oncancel=e=>{e.preventDefault();done(null)};if(i)i.onkeydown=e=>{if(e.key==='Enter')gid('md_o').click()};md.showModal();if(i)i.select()})}
const sure=(title,msg,ok)=>ask({title,msg,ok,danger:1}).then(v=>!!v),note=msg=>ask({title:'Heads up',msg,cancel:false,ok:'Got it'});
async function delTx(id){if(await sure('Delete this entry?','This cannot be undone.','Delete')){S.tx=S.tx.filter(t=>t.id!==id);save();R()}}
async function recv(id){const t=S.tx.find(x=>x.id===id),v=await ask({title:t.rec.type==='loan'?'Record repayment':'Record amount received',msg:t.desc+' · pending '+fmt(pend(t)),field:1,type:'number',value:pend(t),ok:'Save'});if(v===null)return;const n=+v;if(n>0){t.rec.got.push({d:today(),a:Math.min(n,pend(t))});save();R()}else note('Enter an amount above 0.')}
async function catAdd(){const n=((await ask({title:'New category',field:1,ok:'Add'}))||'').trim();if(n){S.cats.push({id:uid(),name:n,subs:[],arch:false});save();R()}}
async function catRen(id){const c=S.cats.find(x=>x.id===id),n=((await ask({title:'Rename category',field:1,value:c.name,ok:'Rename'}))||'').trim();if(n){c.name=n;save();R()}}
async function catArch(id){const c=S.cats.find(x=>x.id===id),used=S.tx.some(t=>t.cat===id);if(c.arch)c.arch=false;else if(used){if(await sure('Remove “'+c.name+'”?','It has expenses, so it will be archived. Those expenses keep this category.','Archive'))c.arch=true}else if(await sure('Delete “'+c.name+'”?','It has no expenses, so it will be removed.','Delete'))S.cats=S.cats.filter(x=>x!==c);save();R()}
async function subAdd(id){const n=((await ask({title:'New subcategory',field:1,ok:'Add'}))||'').trim(),c=S.cats.find(x=>x.id===id);if(n&&!c.subs.includes(n)){c.subs.push(n);save();R()}}
async function subEdit(id,i,ren){const c=S.cats.find(x=>x.id===id),o=c.subs[i];if(ren){const n=((await ask({title:'Rename subcategory',field:1,value:o,ok:'Rename'}))||'').trim();if(n){c.subs[i]=n;S.tx.forEach(t=>{if(t.cat===id&&t.sub===o)t.sub=n})}}else if(await sure('Remove “'+o+'”?','Existing expenses keep its name.','Remove'))c.subs.splice(i,1);save();R()}
async function eraseAll(){if(await sure('Erase all data?','Every expense and setting will be deleted. Back up first if unsure.','Erase')){S=fresh();save();R()}}
function io(k){let txt='',ttl='';if(k==='json'){txt=JSON.stringify(S);ttl='Backup JSON'}else if(k==='csv'){const h=['Date','Description','Amount','Category','Subcategory','Necessity','Frequency','Payment','Purpose','Months','Person','Notes','Recovery','Expected back','Received','Net'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';txt=[h.map(q).join(','),...S.tx.map(t=>[t.date,t.desc,t.amount,catName(t.cat),t.sub,t.nec,t.freq,t.pay,t.purpose,t.dur,t.person,t.notes,t.rec?t.rec.type:'',t.rec?t.rec.exp:'',got(t),t.amount-got(t)].map(q).join(','))].join('\n');ttl='CSV export'}else ttl='Restore backup';
dlg.innerHTML=`<h3>${ttl}</h3><div class="m" style="margin-bottom:8px">${k==='restore'?'Paste a JSON backup below. This replaces current data.':'Copy this text and save it as a file, or download it.'}</div><textarea id="io_t" rows="10" style="width:100%;font:12px monospace" ${k==='restore'?'':'readonly'}>${k==='restore'?'':esc(txt)}</textarea><div class="tools" style="margin:12px 0 0;justify-content:flex-end"><button class="b" onclick="dlg.close()">Close</button>${k==='restore'?'<button class="b p" onclick="restore()">Restore</button>':'<button class="b" onclick="io_t.select();document.execCommand(\'copy\')">Copy</button><button class="b p" onclick="dl(\''+k+'\')">Download</button>'}</div>`;dlg.showModal();window._io=txt}
function dl(k){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window._io],{type:'text/plain'}));a.download='still-'+today()+'.'+k;a.click()}
function restore(){try{const d=JSON.parse(io_t.value);if(!d.cats||!d.tx)throw 0;S=d;save();dlg.close();R()}catch(e){note('That is not a valid Still backup.')}}
function authScreen(msg){nav.style.display='none';document.body.className='auth';app.innerHTML=`<div class="c" style="max-width:380px;margin:12vh auto 0"><h2 style="margin:0 0 4px">Still</h2><div class="m" style="margin-bottom:14px">Sign in to keep your expenses in sync across devices.</div><div class="f" style="grid-template-columns:1fr"><label>Email<input id="ae" type="email" autocomplete="email"></label><label>Password<input id="ap" type="password" autocomplete="current-password"></label></div><div class="m up" style="margin:10px 0">${esc(msg||'')}</div><div class="tools"><button class="b p" onclick="auth(0)">Sign in</button><button class="b" onclick="auth(1)">Create account</button></div></div>`}
async function auth(up){const e=ae.value.trim(),p=ap.value;if(!e||p.length<6){authScreen('Enter your email and a password of at least 6 characters.');return}const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error){authScreen(r.error.message);return}if(!r.data.session){authScreen('Check your email to confirm your account, then sign in.');return}boot()}
async function out(){await sb.auth.signOut();try{localStorage.removeItem('still.v1')}catch(e){}S=fresh();user=null;authScreen()}
async function boot(){if(!CFG.url||CFG.url.includes('YOUR')){app.innerHTML='<div class="c">Add your Supabase project URL and anon key to config.js.</div>';return}
sb=sb||supabase.createClient(CFG.url,CFG.key);const{data:{session}}=await sb.auth.getSession();if(!session){authScreen();return}
user=session.user;const row=await pull();if(row){S=row.data;synced=+new Date(row.updated_at);try{localStorage.setItem('still.v1',JSON.stringify(S))}catch(e){}}else{if(!S||!S.cats)S=fresh();await push()}
nav.style.display='';R()}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&user&&!tm){const r=await pull();if(r&&+new Date(r.updated_at)>synced+1000){S=r.data;synced=+new Date(r.updated_at);R()}}});
boot();
</script></body></html>
